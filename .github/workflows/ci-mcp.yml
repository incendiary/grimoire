name: CI — MCP Server

on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - ".github/workflows/ci-mcp.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp-server/**"
      - ".github/workflows/ci-mcp.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: "mcp-server/.nvmrc"
          cache: "npm"
          cache-dependency-path: "mcp-server/package-lock.json"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: "mcp-server/.nvmrc"
          cache: "npm"
          cache-dependency-path: "mcp-server/package-lock.json"
      - run: npm ci
      - run: npm test
