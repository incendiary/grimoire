name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: find . -name "*.sh" -not -path "./.git/*" -not -path "./clusters-private/*" -exec shellcheck {} +

  structure:
    name: Skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert every skill directory has SKILL.md and README.md
        run: |
          set -e
          failed=0
          # Only check public clusters — private submodule has its own CI
          for dir in clusters/*/*/; do
            if [ ! -f "${dir}SKILL.md" ]; then
              echo "ERROR: missing SKILL.md in ${dir}"
              failed=1
            fi
            if [ ! -f "${dir}README.md" ]; then
              echo "ERROR: missing README.md in ${dir}"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All skill directories have SKILL.md and README.md"

  registry-sync:
    name: Registry sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Every Type:action SKILL.md must be in registry
        run: |
          set -e
          failed=0
          for f in $(grep -rl '> \*\*Type:\*\* action' clusters/01-meta/*/SKILL.md clusters/07-devops/*/SKILL.md 2>/dev/null); do
            if ! grep -q "\"$f\"" mcp-server/registry.json; then
              echo "ERROR: $f has Type: action but no registry entry"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "All action skills are registered"
      - name: Every registry entry must point to a valid Type:action SKILL.md
        run: |
          set -e
          failed=0
          for skill_path in $(python3 -c "import json; r=json.load(open('mcp-server/registry.json')); [print(t['skill']) for t in r['tools']]"); do
            if [ ! -f "$skill_path" ]; then
              echo "ERROR: registry entry points to missing file: $skill_path"
              failed=1
            elif ! grep -q '> \*\*Type:\*\* action' "$skill_path"; then
              echo "ERROR: registry entry points to $skill_path which lacks Type: action"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "All registry entries are valid"

  readme-quality:
    name: README quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Every skill README has Installation section with multi-platform
        run: |
          set -e
          failed=0
          for readme in clusters/*/*/README.md; do
            [ -f "$readme" ] || continue
            if ! grep -q '## Installation' "$readme"; then
              echo "WARNING: missing ## Installation in $readme"
              failed=1
            fi
            # Check for at least 2 platform targets
            platforms=0
            if grep -q 'claude/skills' "$readme"; then platforms=$((platforms+1)); fi
            if grep -q '#<\|#skill-name\|prompt\|Copilot Chat' "$readme"; then platforms=$((platforms+1)); fi
            if grep -q 'MCP\|mcp' "$readme"; then platforms=$((platforms+1)); fi
            if [ "$platforms" -lt 2 ]; then
              echo "WARNING: $readme has fewer than 2 platform targets ($platforms found)"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Some READMEs need multi-platform install sections."
            echo "See docs/skill-readme-template.md for the expected format."
            exit 1
          fi
          echo "All skill READMEs have multi-platform installation"
      - name: No stale path references
        run: |
          set -e
          failed=0
          for readme in clusters/*/*/README.md; do
            [ -f "$readme" ] || continue
            if grep -q '/path/to/grimoire\|loadout/' "$readme"; then
              echo "ERROR: stale path reference in $readme"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "No stale paths found"
