name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, catches env/tool drift even with no code changes.
    - cron: "0 6 * * 1"

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        run: find . -name "*.sh" -not -path "./.git/*" -not -path "./clusters-*/*" -exec shellcheck {} +
      - name: Scripts must run on macOS bash 3.2 (no mapfile, readarray, declare -A)
        run: |
          if grep -rnE '^\s*(mapfile|readarray)\b|declare -A' --include='*.sh' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.claude; then
            echo "ERROR: bash 4 builtins found; macOS ships bash 3.2"
            exit 1
          fi

  structure:
    name: Skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert every skill directory has SKILL.md
        run: |
          set -e
          failed=0
          for dir in clusters/*/*/; do
            if [ ! -f "${dir}SKILL.md" ]; then
              echo "ERROR: missing SKILL.md in ${dir}"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "All skill directories have SKILL.md"
      - name: Every SKILL.md has name/description frontmatter
        run: bash scripts/check-frontmatter.sh
      - name: SKILLS.md catalogue is current
        run: bash scripts/gen-catalogue.sh --check
      - name: install-all.sh removes renamed and retired skills
        run: bash tests/test-install-renames.sh

  registry-sync:
    name: Registry sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Every Type:action SKILL.md must be registered or excluded in registry
        run: |
          set -e
          failed=0
          for f in $(grep -rl '> \*\*Type:\*\* action' clusters/*/*/SKILL.md 2>/dev/null); do
            if ! grep -q "\"$f\"" mcp-server/registry.json; then
              echo "ERROR: $f has Type: action but is neither registered nor excluded"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "All action skills are registered"
      - name: Every registry entry must point to a valid Type:action SKILL.md
        run: |
          set -e
          failed=0
          for skill_path in $(python3 -c "import json; r=json.load(open('mcp-server/registry.json')); [print(t['skill']) for t in r['tools']]"); do
            if [ ! -f "$skill_path" ]; then
              echo "ERROR: registry entry points to missing file: $skill_path"
              failed=1
            elif ! grep -q '> \*\*Type:\*\* action' "$skill_path"; then
              echo "ERROR: registry entry points to $skill_path which lacks Type: action"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "All registry entries are valid"
      - name: Every registry entry's script must exist
        run: |
          set -e
          failed=0
          for script in $(python3 -c "import json; [print(t['script'].split()[0]) for t in json.load(open('mcp-server/registry.json'))['tools']]"); do
            if [ ! -f "$script" ]; then
              echo "ERROR: registry script missing: $script"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "All registry scripts exist"

