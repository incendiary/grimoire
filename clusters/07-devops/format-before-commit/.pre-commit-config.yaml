# .pre-commit-config.yaml
# Standard Python project pre-commit configuration.
# Generated by grimoire format-before-commit skill.
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
#
# Update pinned versions:
#   pre-commit autoupdate

repos:
  # ── Secrets scanning ────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── General file hygiene ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Python formatting (black) ────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3

  # ── Python linting + import sorting (ruff) ──────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # ── Shell scripts ────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # ── README version pin check ─────────────────────────────────────────────
  # Uncomment to gate commits on README install pins matching current version.
  # Requires: grimoire readme-version-pin skill installed alongside this config.
  #
  # - repo: local
  #   hooks:
  #     - id: readme-version-pin
  #       name: README version pin check
  #       language: script
  #       entry: bash check_readme_version.sh
  #       pass_filenames: false
  #       always_run: true
