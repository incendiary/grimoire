# pyproject.toml — Python tooling configuration template
# Generated by grimoire format-before-commit skill.
# Drop into your project root and adjust as needed.

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
# Exclude generated files and vendored code
extend-exclude = '''
/(
  | migrations
  | __pycache__
  | \.eggs
  | \.git
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — black handles this
    "B008",  # function call in default arg — common pattern
]

[tool.ruff.lint.isort]
known-first-party = ["<your_package>"]  # replace with your package name

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert allowed in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Uncomment to enable coverage:
# addopts = "-v --tb=short --cov=<package> --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80  # raise once baseline coverage established
